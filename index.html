<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Sea Arcade Portfolio - Gam</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #5bcefa 0%, #366bc9 30%, #5a2e98 70%, #0a0515 100%);
            font-family: 'Mali', cursive, sans-serif;
            user-select: none; 
            -webkit-user-select: none;
        }
        canvas {
            display: block;
        }

        #ui-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #hint {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #d4f0ff;
            font-size: 1.2rem;
            text-shadow: 0 0 10px #00ffff, 0 2px 4px rgba(0,0,0,0.5);
            animation: float 2s infinite ease-in-out;
            pointer-events: none;
        }

        #popup-modal {
            display: none;
            pointer-events: auto;
            background: rgba(20, 15, 50, 0.85);
            border: 2px solid rgba(176, 38, 255, 0.6);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 20px rgba(176, 38, 255, 0.4);
            border-radius: 20px;
            padding: 35px;
            width: 85%;
            max-width: 500px;
            color: #e0f7fa;
            position: relative;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transform: scale(0.9);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        #popup-modal.show {
            display: block;
            transform: scale(1);
        }

        #popup-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.5rem;
            color: #b026ff;
            text-shadow: 0 0 15px rgba(176, 38, 255, 0.8);
            margin-bottom: 15px;
            border-bottom: 2px dashed #00ffff;
            padding-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
        }

        #popup-content {
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 30px;
            text-align: center;
        }

        #popup-content strong {
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }

        .portfolio-link {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 20px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            border-radius: 10px;
            color: #00ffff;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.2s;
        }

        .portfolio-link:hover {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            transform: scale(1.05);
        }

        #close-btn {
            background: linear-gradient(90deg, #b026ff 0%, #3a7bd5 100%);
            border: none;
            color: white;
            font-family: 'Mali', cursive;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(176, 38, 255, 0.4);
            width: 100%;
        }

        #close-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(176, 38, 255, 0.6);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div id="hint">👆 Click & Drag Joystick to move sharks | Slide to adjust light | Click buttons for info</div>

    <div id="ui-container">
        <div id="popup-modal">
            <div id="popup-title">Title</div>
            <div id="popup-content">Content</div>
            <button id="close-btn" onclick="closePopup()">Close</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

        // --- Web Audio API (Retro Arcade Sounds) ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playButtonSound() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        let lastJoySoundTime = 0;
        function playJoystickSound() {
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            if (now - lastJoySoundTime < 0.15) return; 
            lastJoySoundTime = now;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square'; 
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
            gain.gain.setValueAtTime(0.03, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(now + 0.05);
        }

        let lastSlideSoundTime = 0;
        function playSliderSound() {
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            if (now - lastSlideSoundTime < 0.05) return; 
            lastSlideSoundTime = now;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1500, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.03);
            gain.gain.setValueAtTime(0.02, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(now + 0.03);
        }

        window.addEventListener('pointerdown', initAudio, { once: true });

        // --- Data ---
        const portfolioData = {
            profile: {
                title: "Profile & Education",
                content: "<strong>Full name:</strong> Miss Siapak Khonthothongkam<br><strong>Nickname:</strong> Gam<br><strong>Age:</strong> 22 years<br><strong>Date of birth:</strong> July 10, 2004<br><br><strong>Studying at:</strong><br>Rajamangala University of Technology Rattanakosin<br><strong>Major:</strong> Digital Media Design<br><strong>Specializing in:</strong> Game and Animation"
            },
            skills: {
                title: "My Skills",
                content: "<strong>Character Design</strong><br><strong>Product Design</strong><br><br><strong>3D Modeling:</strong><br>Autodesk MAYA, Blender, Nomad Sculpt<br><br><strong>Illustration:</strong> 2D Art"
            },
            contact: {
                title: "Contact",
                content: "<strong>Facebook:</strong> Gam Sirapak<br><strong>Line:</strong> 0618013355<br><strong>Gmail:</strong> gamsirapak2004@gmail.com<br><strong>Telephone:</strong> 0618013355"
            },
            // ปุ่มผลงาน 4 ปุ่ม
            work3d: {
                title: "3D Modeling",
                content: "<strong>ผลงาน 3 มิติของฉัน</strong><br><br>รวมผลงานการปั้นและออกแบบโมเดล 3D<br>ด้วยโปรแกรม MAYA, Blender และ Nomad Sculpt<br><br><a href='#' target='_blank' class='portfolio-link'>คลิกเพื่อเข้าชมผลงาน</a>"
            },
            work2d: {
                title: "2D Illustration",
                content: "<strong>ผลงานวาดภาพ 2 มิติ</strong><br><br>รวมผลงานออกแบบคาแรคเตอร์ ภาพประกอบ<br>และ Digital Painting ต่างๆ<br><br><a href='#' target='_blank' class='portfolio-link'>คลิกเพื่อเข้าชมผลงาน</a>"
            },
            workgame: {
                title: "Game Design",
                content: "<strong>ผลงานเกมดีไซน์</strong><br><br>รวมผลงานการออกแบบเกมเพลย์และสร้างเกม<br>ที่นำเสนอแนวคิดและความคิดสร้างสรรค์<br><br><a href='#' target='_blank' class='portfolio-link'>คลิกเพื่อเข้าชมผลงาน</a>"
            },
            workother: {
                title: "Other Works",
                content: "<strong>ผลงานอื่นๆ</strong><br><br>รวมผลงานการออกแบบในด้านอื่นๆ<br>และการสร้างสรรค์โปรเจกต์ที่น่าสนใจ<br><br><a href='#' target='_blank' class='portfolio-link'>คลิกเพื่อเข้าชมผลงาน</a>"
            }
        };

        // --- Scene & Camera ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x362c69, 0.015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-18, 8, 28);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2;
        controls.target.set(0, -1, 0);

        // --- Bloom Effect ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.15;
        bloomPass.strength = 1.6;
        bloomPass.radius = 0.6;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- Lighting ---
        const sunLight = new THREE.DirectionalLight(0xaaddff, 3);
        sunLight.position.set(0, 20, 10);
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0x2a1a4a, 2.0);
        scene.add(ambientLight);

        const tankLight = new THREE.PointLight(0x00ffff, 100, 25);
        tankLight.position.set(0, 2, 0);
        scene.add(tankLight);

        const holoLight = new THREE.PointLight(0x00ffff, 40, 15);
        holoLight.position.set(9, 2, 0);
        scene.add(holoLight);

        // --- Materials (Pixel Art Style) ---
        function createPixelTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#111628';
            ctx.fillRect(0,0,128,128);
            for(let i=0; i<300; i++){
                ctx.fillStyle = Math.random() > 0.5 ? '#1a223d' : '#0c101d';
                ctx.fillRect(Math.floor(Math.random()*32)*4, Math.floor(Math.random()*32)*4, 4, 4);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter; 
            return tex;
        }

        const cabinetMat = new THREE.MeshStandardMaterial({ map: createPixelTexture(), roughness: 0.6, metalness: 0.5 });
        const trimMat = new THREE.MeshStandardMaterial({ color: 0x2a1a4a, roughness: 0.5, metalness: 0.8 });

        // --- Hollow Arcade Cabinet ---
        const machineGroup = new THREE.Group();
        scene.add(machineGroup);

        const radiusCorner = 0.5;
        const segmentCorner = 4;

        const topWall = new THREE.Mesh(new RoundedBoxGeometry(14, 2, 10, segmentCorner, radiusCorner), cabinetMat);
        topWall.position.y = 6;
        machineGroup.add(topWall);

        const botWall = new THREE.Mesh(new RoundedBoxGeometry(14, 4, 10, segmentCorner, radiusCorner), cabinetMat);
        botWall.position.y = -5;
        machineGroup.add(botWall);

        const leftWall = new THREE.Mesh(new RoundedBoxGeometry(2, 10, 10, segmentCorner, radiusCorner), cabinetMat);
        leftWall.position.set(-6, 1, 0);
        machineGroup.add(leftWall);

        const rightWall = new THREE.Mesh(new RoundedBoxGeometry(2, 10, 10, segmentCorner, radiusCorner), cabinetMat);
        rightWall.position.set(6, 1, 0);
        machineGroup.add(rightWall);

        const base = new THREE.Mesh(new RoundedBoxGeometry(15, 2, 11, segmentCorner, radiusCorner), trimMat);
        base.position.y = -8;
        machineGroup.add(base);

        // --- แผงควบคุมเกมด้านหน้า (Control Desk) ---
        const deskGroup = new THREE.Group();
        deskGroup.position.set(0, -4.5, 6.5); 
        machineGroup.add(deskGroup);

        const deskPanel = new THREE.Mesh(new RoundedBoxGeometry(14, 1.5, 4.5, 4, 0.4), trimMat);
        deskGroup.add(deskPanel);

        // 1. ปุ่มบังคับทิศทาง (D-pad) 
        const dpadMat = new THREE.MeshStandardMaterial({ color: 0x444455, roughness: 0.3 });
        const dpadCenter = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 0.8), dpadMat);
        dpadCenter.position.set(-4.5, 0.75, -0.6);
        deskGroup.add(dpadCenter);

        const vDpad = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.45, 2), dpadMat);
        vDpad.position.set(-4.5, 0.75, -0.6);
        deskGroup.add(vDpad);
        
        const hDpad = new THREE.Mesh(new THREE.BoxGeometry(2, 0.45, 0.6), dpadMat);
        hDpad.position.set(-4.5, 0.75, -0.6);
        deskGroup.add(hDpad);

        // 2. คันโยกตรงกลาง (Joystick)
        const joystickGroup = new THREE.Group();
        joystickGroup.position.set(-1.0, 0.75, -0.6);
        deskGroup.add(joystickGroup);

        const joyBase = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.8, 0.2, 32), trimMat);
        joyBase.position.set(-1.0, 0.8, -0.6);
        deskGroup.add(joyBase);

        const joyStick = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.2, 16), new THREE.MeshStandardMaterial({color: 0x888888, metalness: 0.9}));
        joyStick.position.y = 0.6;
        joystickGroup.add(joyStick);

        const joyBall = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 32), new THREE.MeshStandardMaterial({color: 0xff1144, roughness: 0.2}));
        joyBall.position.y = 1.2;
        joyBall.userData = { isJoystick: true }; 
        joystickGroup.add(joyBall);

        // 3. แถบสไลเดอร์ปรับแสง (ขวาสุด)
        const trackCanvas = document.createElement('canvas');
        trackCanvas.width = 256; trackCanvas.height = 32;
        const trCtx = trackCanvas.getContext('2d');
        const trGrad = trCtx.createLinearGradient(0, 0, 256, 0);
        trGrad.addColorStop(0, '#0055ff'); 
        trGrad.addColorStop(1, '#b026ff'); 
        trCtx.fillStyle = trGrad;
        trCtx.fillRect(0, 0, 256, 32);
        const trackTex = new THREE.CanvasTexture(trackCanvas);
        const trackMat = new THREE.MeshBasicMaterial({ map: trackTex });

        const trackGeo = new THREE.PlaneGeometry(4.5, 0.8);
        const trackMesh = new THREE.Mesh(trackGeo, trackMat);
        trackMesh.rotation.x = -Math.PI / 2;
        trackMesh.position.set(3.5, 0.76, -0.6);
        deskGroup.add(trackMesh);

        const knobGeo = new THREE.BoxGeometry(0.5, 0.6, 1.2);
        const knobMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x00ffff, emissiveIntensity: 0.8 });
        const sliderKnob = new THREE.Mesh(knobGeo, knobMat);
        sliderKnob.position.set(3.5, 1.0, -0.6); 
        deskGroup.add(sliderKnob);

        // 4. ปุ่มผลงาน 4 ปุ่ม
        const interactiveObjects = []; 
        const btnContactGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 32);

        function createContactButton(x, z, colorHex, key) {
            const btnContainer = new THREE.Group();
            btnContainer.position.set(x, 0.75, z);
            
            const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 0.15, 32), trimMat);
            ring.position.y = 0.08;
            btnContainer.add(ring);

            const btnMat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.6 });
            const btn = new THREE.Mesh(btnContactGeo, btnMat);
            btn.position.y = 0.15;
            btn.userData = { key: key };
            btnContainer.add(btn);
            
            deskGroup.add(btnContainer);
            interactiveObjects.push(btn);
        }

        createContactButton(-4.5, 1.0, 0x0066ff, 'work3d');     // ฟ้า
        createContactButton(-1.8, 1.0, 0x00ff33, 'work2d');     // เขียว
        createContactButton(0.9, 1.0, 0xff1111, 'workgame');    // แดง
        createContactButton(3.6, 1.0, 0xb026ff, 'workother');   // ม่วง

        // --- ป้าย MY PORTFOLIO ---
        const signCanvas = document.createElement('canvas');
        signCanvas.width = 1024; signCanvas.height = 256;
        const signTex = new THREE.CanvasTexture(signCanvas);

        const marqueeBox = new THREE.Mesh(new RoundedBoxGeometry(10, 2, 3, 4, 0.2), trimMat);
        marqueeBox.position.set(0, 8, 3);
        machineGroup.add(marqueeBox);
        
        const marqueeScreen = new THREE.Mesh(new THREE.PlaneGeometry(9, 1.5), new THREE.MeshBasicMaterial({map: signTex, transparent: true}));
        marqueeScreen.position.set(0, 8, 4.51);
        machineGroup.add(marqueeScreen);

        // Gradient Water Background
        const wCanvas = document.createElement('canvas');
        wCanvas.width = 256; wCanvas.height = 512;
        const wCtx = wCanvas.getContext('2d');
        const wGrad = wCtx.createLinearGradient(0, 0, 0, 512);
        wGrad.addColorStop(0, '#5bcefa'); 
        wGrad.addColorStop(0.5, '#366bc9');
        wGrad.addColorStop(1, '#0f0524'); 
        wCtx.fillStyle = wGrad;
        wCtx.fillRect(0, 0, 256, 512);
        const waterTex = new THREE.CanvasTexture(wCanvas);
        const waterBackMat = new THREE.MeshBasicMaterial({ map: waterTex, side: THREE.DoubleSide });

        const backWaterWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), waterBackMat);
        backWaterWall.position.set(0, 1, -4.9);
        machineGroup.add(backWaterWall);

        // --- แสงสะท้อนผิวน้ำบางๆ (Faint Caustics) ---
        function createFaintCausticTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0,0,512,512);
            
            ctx.lineWidth = 1.5;
            for(let i=0; i<80; i++) {
                ctx.beginPath();
                const y = Math.random() * 512;
                const alpha = 1.0 - (y / 512); 
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.arc(Math.random()*512, y, 15+Math.random()*30, 0, Math.PI*2);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }
        
        const causticTex = createFaintCausticTexture();
        const causticMat = new THREE.MeshBasicMaterial({
            map: causticTex,
            color: 0xffffff,
            transparent: true,
            opacity: 0.08, 
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        
        const causticMesh = new THREE.Mesh(new THREE.PlaneGeometry(11, 5), causticMat);
        causticMesh.position.set(0, 3.5, 3.8); 
        machineGroup.add(causticMesh);

        // Left Panel (Button Panel - Portfolio Info)
        const sidePanel = new THREE.Mesh(new RoundedBoxGeometry(2, 8, 4, 4, 0.4), trimMat);
        sidePanel.position.set(-7.5, 1, 2);
        machineGroup.add(sidePanel);

        // --- ปุ่ม Info (ซ้ายตู้) ---
        const btnGeoInfo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 32);
        const neonCyan = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const neonPurple = new THREE.MeshBasicMaterial({ color: 0xb026ff });
        
        function createInfoButton(y, z, mat, key) {
            const btn = new THREE.Mesh(btnGeoInfo, mat);
            btn.rotation.z = Math.PI / 2;
            btn.position.set(-8.5, y, z);
            btn.userData = { key: key };
            machineGroup.add(btn);
            interactiveObjects.push(btn);
        }

        createInfoButton(3, 2, neonCyan, 'profile');
        createInfoButton(1, 2, neonPurple, 'skills');
        createInfoButton(-1, 2, neonCyan, 'contact');

        // --- สติกเกอร์ปลาดาว 2D กระจายเต็มตู้ ---
        function createStarfishTexture() {
            const sfCanvas = document.createElement('canvas');
            sfCanvas.width = 256; sfCanvas.height = 256;
            const sfCtx = sfCanvas.getContext('2d');
            
            const cx = 128, cy = 128, outer = 95, inner = 45;
            sfCtx.beginPath();
            for (let i = 0; i < 10; i++) {
                const radius = i % 2 === 0 ? outer : inner;
                const angle = (i * Math.PI) / 5 - Math.PI / 2;
                const x = cx + Math.cos(angle) * radius;
                const y = cy + Math.sin(angle) * radius;
                if (i === 0) sfCtx.moveTo(x, y);
                else sfCtx.lineTo(x, y);
            }
            sfCtx.closePath();
            
            sfCtx.lineJoin = 'round';
            sfCtx.lineWidth = 25;
            sfCtx.strokeStyle = '#ff7700'; 
            sfCtx.stroke();
            sfCtx.fillStyle = '#ff7700';
            sfCtx.fill();

            sfCtx.fillStyle = '#ffaa33';
            for(let i=0; i<5; i++) {
                const angle = (i * Math.PI*2) / 5 - Math.PI / 2;
                sfCtx.beginPath(); 
                sfCtx.arc(cx + Math.cos(angle)*50, cy + Math.sin(angle)*50, 8, 0, Math.PI*2); 
                sfCtx.fill();
            }
            return new THREE.CanvasTexture(sfCanvas);
        }

        const sfTex = createStarfishTexture();
        const sfMat = new THREE.MeshBasicMaterial({ map: sfTex, transparent: true, alphaTest: 0.1 });
        
        function addStarfishDecal(x, y, z, rotX, rotY, rotZ, scale) {
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), sfMat);
            mesh.position.set(x, y, z);
            mesh.rotation.set(rotX, rotY, rotZ);
            mesh.scale.setScalar(scale);
            machineGroup.add(mesh);
        }

        for(let i = 0; i < 12; i++) {
            addStarfishDecal(-7.01, -3 + Math.random()*9, -4 + Math.random()*8, 0, -Math.PI/2, Math.random()*Math.PI, 0.5 + Math.random()*0.5);
            addStarfishDecal(7.01, -3 + Math.random()*9, -4 + Math.random()*8, 0, Math.PI/2, Math.random()*Math.PI, 0.5 + Math.random()*0.5);
        }
        for(let i = 0; i < 8; i++) {
            addStarfishDecal(-5 + Math.random()*10, 7.01, -4 + Math.random()*8, -Math.PI/2, 0, Math.random()*Math.PI, 0.6 + Math.random()*0.4);
            addStarfishDecal(-4 + Math.random()*8, -2 + Math.random()*6, -4.8, 0, 0, Math.random()*Math.PI, 0.5 + Math.random()*0.4);
        }

        // --- Inside Tank: Rocks, Corals, Seaweed, Bubbles ---
        const envGroup = new THREE.Group();
        envGroup.position.set(0, -2.5, 0); 
        machineGroup.add(envGroup);

        const rockMat = new THREE.MeshStandardMaterial({ color: 0x4a4a5a, roughness: 0.9 });
        for(let i=0; i<25; i++) {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.2 + Math.random()*0.4), rockMat);
            rock.position.set((Math.random()-0.5)*9, -0.4, (Math.random()-0.5)*9);
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            envGroup.add(rock);
        }

        const coralColors = [0xff4488, 0xaa55ff, 0x33ccff];
        for(let i=0; i<10; i++) {
            const coral = new THREE.Mesh(
                new THREE.TorusKnotGeometry(0.4, 0.15, 64, 16, 2, 3), 
                new THREE.MeshStandardMaterial({ color: coralColors[i%3], roughness: 0.8 })
            );
            coral.position.set((Math.random()-0.5)*8, 0.2, (Math.random()-0.5)*6);
            coral.rotation.set(Math.random(), Math.random(), Math.random());
            envGroup.add(coral);
        }

        const seaweeds = [];
        const seaweedMat = new THREE.MeshStandardMaterial({ color: 0x22aa55, roughness: 0.7 });
        for(let i=0; i<15; i++) {
            const base = new THREE.Group();
            base.position.set((Math.random()-0.5)*9, -0.2, (Math.random()-0.5)*7);
            let currentParent = base;
            const nodes = [];
            
            const numSegments = 4 + Math.floor(Math.random() * 7);
            for(let j=0; j<numSegments; j++) {
                const pivot = new THREE.Group();
                pivot.position.y = j === 0 ? 0 : 0.4;
                const radius = 0.12 - (j / numSegments) * 0.08;
                const seg = new THREE.Mesh(new THREE.CapsuleGeometry(radius, 0.3, 8, 16), seaweedMat);
                seg.position.y = 0.2;
                pivot.add(seg);
                currentParent.add(pivot);
                nodes.push(pivot);
                currentParent = pivot;
            }
            envGroup.add(base);
            seaweeds.push({nodes, offset: Math.random() * Math.PI * 2, speed: 1 + Math.random()});
        }

        const bubbles = [];
        const bubbleGeo = new THREE.SphereGeometry(0.1, 16, 16);
        const bubbleMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff, transmission: 1, opacity: 1, transparent: true, roughness: 0
        });

        for(let i=0; i<40; i++) {
            const bubble = new THREE.Mesh(bubbleGeo, bubbleMat);
            bubble.position.set((Math.random() - 0.5) * 8, -2 + Math.random() * 6, (Math.random() - 0.5) * 6);
            bubble.scale.setScalar(0.5 + Math.random() * 1.5);
            bubble.userData = { speed: 0.02 + Math.random() * 0.04, xOffset: bubble.position.x };
            machineGroup.add(bubble);
            bubbles.push(bubble);
        }

        // --- Realistic Chubby Sharks ---
        function createShark(scaleFactor) {
            const sGroup = new THREE.Group();
            const sBlue = new THREE.MeshStandardMaterial({ color: 0x113366, roughness: 0.4 }); 
            const sWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
            const sBlack = new THREE.MeshBasicMaterial({ color: 0x000000 });

            const sBodyGeo = new THREE.SphereGeometry(1.2, 32, 32);
            sBodyGeo.scale(1, 0.8, 2.5);
            const sBody = new THREE.Mesh(sBodyGeo, sBlue);
            sGroup.add(sBody);
            
            const sBellyGeo = new THREE.SphereGeometry(1.18, 32, 16, 0, Math.PI*2, Math.PI/2, Math.PI/2);
            sBellyGeo.scale(1, 0.8, 2.4);
            const sBelly = new THREE.Mesh(sBellyGeo, sWhite);
            sBelly.position.y = -0.05;
            sGroup.add(sBelly);

            const snout = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.5, 32), sBlue);
            snout.rotation.x = Math.PI / 2;
            snout.position.set(0, 0.1, 2.5);
            sGroup.add(snout);
            const snoutBelly = new THREE.Mesh(new THREE.ConeGeometry(0.78, 1.48, 32), sWhite);
            snoutBelly.rotation.x = Math.PI / 2;
            snoutBelly.position.set(0, -0.05, 2.48);
            sGroup.add(snoutBelly);

            const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), sBlack);
            eyeR.position.set(0.7, 0.3, 1.8);
            sGroup.add(eyeR);
            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), sBlack);
            eyeL.position.set(-0.7, 0.3, 1.8);
            sGroup.add(eyeL);

            const sDorsal = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.5, 32), sBlue);
            sDorsal.position.set(0, 1.2, 0.5);
            sDorsal.rotation.x = -0.5;
            sGroup.add(sDorsal);

            const sFinL = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.5, 32), sBlue);
            sFinL.position.set(1.0, -0.2, 0.5);
            sFinL.rotation.set(-0.5, 0, -1.2);
            sGroup.add(sFinL);

            const sFinR = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.5, 32), sBlue);
            sFinR.position.set(-1.0, -0.2, 0.5);
            sFinR.rotation.set(-0.5, 0, 1.2);
            sGroup.add(sFinR);

            const sTail = new THREE.Group();
            sTail.position.set(0, 0, -2.5);
            
            const sTailTop = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.5, 32), sBlue);
            sTailTop.position.set(0, 0.6, -0.5);
            sTailTop.rotation.x = -0.8;
            sTail.add(sTailTop);
            
            const sTailBot = new THREE.Mesh(new THREE.ConeGeometry(0.25, 1.2, 32), sBlue);
            sTailBot.position.set(0, -0.5, -0.3);
            sTailBot.rotation.x = -2.3;
            sTail.add(sTailBot);
            
            sGroup.add(sTail);
            sGroup.userData.tail = sTail; 

            sGroup.scale.setScalar(scaleFactor); 
            return sGroup;
        }

        const sharks = [];
        const shark1 = createShark(0.7); 
        const shark2 = createShark(0.5); 
        const shark3 = createShark(0.4); 

        shark1.userData.offsetX = 0; shark1.userData.offsetZ = 0;
        shark2.userData.offsetX = -1.5; shark2.userData.offsetZ = -1.5;
        shark3.userData.offsetX = 1.2; shark3.userData.offsetZ = -2.0;

        sharks.push(shark1, shark2, shark3);

        sharks.forEach((s) => {
            s.position.y = 1;
            s.userData.wanderSpeedX = 0.4 + Math.random() * 0.4;
            s.userData.wanderSpeedZ = 0.3 + Math.random() * 0.3;
            s.userData.wanderPhaseX = Math.random() * Math.PI * 2;
            s.userData.wanderPhaseZ = Math.random() * Math.PI * 2;
            s.userData.wanderRangeX = 2.5 + Math.random();
            s.userData.wanderRangeZ = 2.0 + Math.random();
            machineGroup.add(s);
        });

        // --- Holographic Projection ---
        const hologramGroup = new THREE.Group();
        hologramGroup.position.set(9, -1, 0);
        machineGroup.add(hologramGroup);

        const projectorGeo = new THREE.SphereGeometry(1.5, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        const projector = new THREE.Mesh(projectorGeo, trimMat);
        projector.position.set(0, -2, 0);
        hologramGroup.add(projector);

        const holoParticles = new THREE.Group();
        const pMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });

        for(let i=0; i<40; i++) {
            const p = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), pMat);
            p.position.set((Math.random() - 0.5) * 3, Math.random() * 5, (Math.random() - 0.5) * 3);
            p.userData = { speed: 0.01 + Math.random() * 0.02, offset: Math.random() * 10 };
            holoParticles.add(p);
        }
        holoParticles.position.set(0, -1, 0);
        hologramGroup.add(holoParticles);

        // --- Outside Environment ---
        const outsideElements = [];
        const outFishGeo = new THREE.ConeGeometry(0.3, 1.2, 4); 
        outFishGeo.rotateX(Math.PI / 2);
        const outBubbleGeo = new THREE.SphereGeometry(0.4, 16, 16);

        for (let i = 0; i < 40; i++) {
            let mesh;
            let isFish = i % 2 === 0;
            
            if (isFish) {
                const outFishMat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.5 + Math.random() * 0.3, 1, 0.6) });
                mesh = new THREE.Mesh(outFishGeo, outFishMat);
            } else {
                const outBubbleMat = new THREE.MeshPhysicalMaterial({
                    color: 0xffffff, transmission: 1, opacity: 1, transparent: true, roughness: 0, ior: 1.1
                });
                mesh = new THREE.Mesh(outBubbleGeo, outBubbleMat);
                mesh.scale.setScalar(0.5 + Math.random() * 1.5);
            }
            
            const radius = 25 + Math.random() * 25; 
            const angle = Math.random() * Math.PI * 2;
            
            mesh.position.set(
                Math.cos(angle) * radius,
                (Math.random() - 0.5) * 40,
                Math.sin(angle) * radius
            );
            
            mesh.userData = { 
                isFish: isFish,
                angle: angle, 
                radius: radius, 
                speed: 0.001 + Math.random() * 0.0015, 
                yOffset: mesh.position.y
            };
            scene.add(mesh);
            outsideElements.push(mesh);
        }

        // --- Interaction Logic (Raycaster + Drag Controls) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const modal = document.getElementById('popup-modal');

        let isDraggingSlider = false;
        let isDraggingJoystick = false;
        
        const dragPlane = new THREE.Plane();
        dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, -3.75, 0));

        let sharkManualOffset = new THREE.Vector2(0, 0);

        window.addEventListener('pointerdown', (event) => {
            if(event.target.id === 'close-btn' || event.target.tagName.toLowerCase() === 'a') {
                playButtonSound();
                return;
            }

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            const objectsToCheck = [...interactiveObjects, sliderKnob, joyBall];
            const intersects = raycaster.intersectObjects(objectsToCheck);

            if (intersects.length > 0) {
                const hitObj = intersects[0].object;

                if (hitObj === sliderKnob) {
                    isDraggingSlider = true;
                    controls.enabled = false;
                } 
                else if (hitObj === joyBall) {
                    isDraggingJoystick = true;
                    controls.enabled = false;
                }
                else if (hitObj.userData.key) {
                    playButtonSound(); 
                    
                    const key = hitObj.userData.key;
                    const data = portfolioData[key];
                    document.getElementById('popup-title').innerHTML = data.title;
                    document.getElementById('popup-content').innerHTML = data.content;
                    modal.classList.add('show');

                    const origColor = hitObj.material.color.getHex();
                    hitObj.material.color.setHex(0xffffff);
                    setTimeout(() => hitObj.material.color.setHex(origColor), 150);
                }
            }
        });

        window.addEventListener('pointermove', (event) => {
            if (!isDraggingSlider && !isDraggingJoystick) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(dragPlane, intersectPoint);
            
            const localPt = deskGroup.worldToLocal(intersectPoint.clone());

            if (isDraggingSlider) {
                let newX = localPt.x;
                newX = Math.max(1.25, Math.min(5.75, newX)); 
                sliderKnob.position.x = newX;

                const percent = (newX - 1.25) / 4.5; 
                tankLight.intensity = 20 + (percent * 180);
                sliderKnob.material.emissiveIntensity = 0.5 + (percent * 1.5);
                bloomPass.strength = 1.0 + (percent * 0.8);
                
                playSliderSound(); 
            } 
            else if (isDraggingJoystick) {
                let dx = localPt.x - (-1.0);
                let dz = localPt.z - (-0.6);
                
                const dist = Math.sqrt(dx*dx + dz*dz);
                const maxPull = 0.8;
                if (dist > maxPull) {
                    dx = (dx / dist) * maxPull;
                    dz = (dz / dist) * maxPull;
                }

                joystickGroup.rotation.z = -dx * 0.5;
                joystickGroup.rotation.x = dz * 0.5;

                sharkManualOffset.set(dx * 6, -dz * 4);
                
                if(dist > 0.1) playJoystickSound(); 
            }
        });

        window.addEventListener('pointerup', () => {
            if (isDraggingSlider || isDraggingJoystick) {
                isDraggingSlider = false;
                isDraggingJoystick = false;
                controls.enabled = true; 
            }
        });

        window.closePopup = function() {
            modal.classList.remove('show');
            playButtonSound();
        }

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            causticTex.offset.x = time * 0.05;
            causticTex.offset.y = Math.sin(time * 0.2) * 0.05;

            let baseTargetX, baseTargetZ;
            
            if (isDraggingJoystick) {
                baseTargetX = sharkManualOffset.x;
                baseTargetZ = sharkManualOffset.y;
            } else {
                joystickGroup.rotation.x *= 0.8;
                joystickGroup.rotation.z *= 0.8;
                sharkManualOffset.x *= 0.9;
                sharkManualOffset.y *= 0.9;
            }

            sharks.forEach((s, index) => {
                let tX, tZ;
                
                if (isDraggingJoystick) {
                    tX = baseTargetX + s.userData.offsetX;
                    tZ = baseTargetZ + s.userData.offsetZ;
                    s.userData.tail.rotation.y = Math.sin(time * 15 + index) * 0.5; 
                } else {
                    tX = Math.sin(time * s.userData.wanderSpeedX + s.userData.wanderPhaseX) * s.userData.wanderRangeX;
                    tZ = Math.cos(time * s.userData.wanderSpeedZ + s.userData.wanderPhaseZ) * s.userData.wanderRangeZ;
                    s.userData.tail.rotation.y = Math.sin(time * 5 + index) * 0.3;
                }

                s.position.x += (tX - s.position.x) * 0.05;
                s.position.z += (tZ - s.position.z) * 0.05;
                s.position.y += ((1 + Math.sin(time * 1.2 + index) * 0.3) - s.position.y) * 0.05;

                const moveDx = tX - s.position.x;
                const moveDz = tZ - s.position.z;
                if (Math.abs(moveDx) > 0.01 || Math.abs(moveDz) > 0.01) {
                    const targetRot = Math.atan2(-moveDz, moveDx);
                    let diff = targetRot - s.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    s.rotation.y += diff * 0.08;
                }
            });

            bubbles.forEach(bubble => {
                bubble.position.y += bubble.userData.speed;
                bubble.position.x = bubble.userData.xOffset + Math.sin(time * 2 + bubble.position.y) * 0.2;
                if (bubble.position.y > 5) bubble.position.y = -2;
            });

            seaweeds.forEach((weed, index) => {
                weed.nodes.forEach((node, i) => {
                    node.rotation.z = Math.sin(time * weed.speed + weed.offset + i*0.2) * (0.05 + i*0.03);
                    node.rotation.x = Math.cos(time * (weed.speed*0.8) + weed.offset + i*0.2) * (0.05 + i*0.03);
                });
            });

            holoParticles.children.forEach(p => {
                p.position.y += p.userData.speed;
                p.position.x += Math.sin(time * 3 + p.userData.offset) * 0.01;
                if(p.position.y > 6) p.position.y = 0;
            });
            holoParticles.rotation.y = time * 0.2;

            outsideElements.forEach((el, i) => {
                el.userData.angle += el.userData.speed; 
                el.position.x = Math.cos(el.userData.angle) * el.userData.radius;
                el.position.z = Math.sin(el.userData.angle) * el.userData.radius;
                
                if(el.userData.isFish) {
                    el.position.y = el.userData.yOffset + Math.sin(time * 0.5 + i) * 1.5;
                    el.rotation.y = -el.userData.angle; 
                } else {
                    el.position.y = el.userData.yOffset + Math.sin(time * 0.3 + i) * 2.0;
                }
            });

            controls.update();
            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        document.fonts.ready.then(() => {
            const sCtx = signCanvas.getContext('2d');
            sCtx.clearRect(0, 0, 1024, 256);
            sCtx.fillStyle = '#111628';
            sCtx.fillRect(0, 0, 1024, 256);
            sCtx.font = 'bold 90px "Cinzel Decorative", serif';
            sCtx.textAlign = 'center';
            sCtx.textBaseline = 'middle';
            sCtx.fillStyle = '#b026ff';
            sCtx.shadowColor = '#b026ff';
            sCtx.shadowBlur = 25;
            sCtx.fillText('MY PORTFOLIO', 512, 128);
            signTex.needsUpdate = true;
        });

        animate();
    </script>
</body>
</html>
